[project]
name = "lunchsaga"
version = "0.1.0"
description = "LunchSaga - Team lunch coordination app"
requires-python = ">=3.12"
dependencies = [
    "kinglet>=1.7.0",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "pywrangler",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
