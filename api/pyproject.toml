[project]
name = "lunchsaga-api"
version = "0.1.0"
description = "LunchSaga Backend API - Python Workers + Kinglet ORM + D1"
requires-python = ">=3.12"
dependencies = [
    "kinglet>=1.8.3",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
