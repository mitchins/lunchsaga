sonar.projectKey=mitchins_lunchsaga
sonar.organization=mitchins

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude root component from coverage requirements
# App.tsx is orchestration logic better tested via E2E tests than unit tests.
# The component is fully exercised by E2E test suite covering all routes and navigation.
# Chart primitives are visual utility wrappers with heavy third-party integration that
# are low-value for unit-code coverage versus E2E.
# API client behavior is now covered by unit tests in tests/unit/services/api.spec.ts.
sonar.coverage.exclusions=src/App.tsx,src/components/ui/chart.tsx

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
