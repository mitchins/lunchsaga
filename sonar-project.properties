sonar.projectKey=mitchins_lunchsaga
sonar.organization=mitchins

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# App.tsx is orchestrational shell logic; route-level behavior is covered in E2E.
# src/components/ui/** are vendored shadcn/ui primitives — copy-pasted presentational
# wrappers around third-party UI logic, low-value for unit coverage and validated via E2E.
# API client is covered by tests in `tests/unit/services/api.spec.ts` (`src/services/api.ts`).
sonar.coverage.exclusions=src/App.tsx,src/components/ui/**

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
