sonar.projectKey=mitchins_lunchsaga
sonar.organization=mitchins

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude root component from coverage requirements
# App.tsx is orchestration logic better tested via E2E tests than unit tests
# The component is fully exercised by E2E test suite covering all routes and navigation
sonar.coverage.exclusions=src/App.tsx

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
